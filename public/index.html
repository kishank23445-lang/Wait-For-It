<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wait For It!</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/stable-round.css"><link rel="stylesheet" href="/premium-theme.css"></head>
<body><main id="app"><section id="home" class="card"><p class="eyebrow">2–8 PLAYER PARTY GAME</p><h1>Wait For It!</h1><p class="lede">Don’t tap until the real cue. Fake-outs are everywhere.</p><label>Your name<input id="name" maxlength="16" placeholder="Player name" autocomplete="nickname"></label><button id="create">Create a room</button><div class="divider">or join a friend</div><label>Room code<input id="code" maxlength="4" placeholder="ABCD" autocomplete="off"></label><button id="join" class="secondary">Join room</button><p id="error" role="alert"></p></section>
<section id="game" hidden><header><div><p class="eyebrow" id="room-label">ROOM</p><h1 id="title">Waiting room</h1></div><div id="round-label"></div></header><div class="layout"><section class="card arena"><p id="instruction">Invite friends with your room code.</p><div id="signal">WAIT</div><button id="reaction" aria-label="React" disabled>Tap!</button><p id="status"></p></section><aside class="card"><h2>Players</h2><ol id="players"></ol><button id="start" hidden>Start 10-round match</button><p id="host-note"></p></aside></div><section id="results" class="card" hidden></section></section></main><script src="/app.js"></script><script src="/final-result-ui.js"></script></body></html>
